<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titolo %}Analisi spettri{% endblock %}</title>
  <style>
    body   { font-family: Georgia, "Times New Roman", serif; max-width: 760px;
             margin: 2rem auto; padding: 0 1rem; color: #1d2733; line-height: 1.5; }
    h1     { font-weight: normal; border-bottom: 2px solid #2f5d7c; padding-bottom: .3rem; }
    label  { display: block; margin-top: 1rem; }
    input, select { font: inherit; padding: .3rem; width: 14rem; }
    input[type=checkbox] { width: auto; }
    button { font: inherit; margin-top: 1.5rem; padding: .5rem 1.4rem;
             background: #2f5d7c; color: white; border: 0; cursor: pointer; }
    .errore { background: #fbe9e7; border-left: 4px solid #b3261e; padding: .6rem; }
    table  { border-collapse: collapse; margin-top: 1rem; }
    td, th { border: 1px solid #c7d0d9; padding: .25rem .8rem; text-align: right; }
    th     { background: #eef2f5; }
    img    { max-width: 100%; }
  </style>
</head>
<body>
  {% block contenuto %}{% endblock %}
</body>
</html>
